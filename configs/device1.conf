# Device1 is the handshake client and protects PC1 -> PC2 requests.
role=device1
peer_address=10.0.12.2
listen_address=0.0.0.0
control_port=47000
encrypt_queue=100
decrypt_queue=101
replay_window=128
counter_lookahead=128
connect_timeout_seconds=30
log_level=info

# DEMO ONLY. Generate a fresh 32-byte PSK with scripts/generate_psk.sh and put
# exactly the same value on both devices before a real demonstration.
psk_hex=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
